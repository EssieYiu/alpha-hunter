services:
  frontend:
    image: ${APP_IMAGE:?APP_IMAGE must be provided}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:4173:4173"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
